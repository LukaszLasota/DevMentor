# Local PostgreSQL for development: `docker compose up -d postgres`.
# Credentials match .env.example — local use only, never production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devmentor
      POSTGRES_PASSWORD: devmentor
      POSTGRES_DB: devmentor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmentor -d devmentor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
